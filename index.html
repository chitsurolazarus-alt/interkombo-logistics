<!DOCTYPE html>
<html lang="en-ZA" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interkombo Logistics | Removals, Relocation & Cross-Border Freight</title>
  <meta name="description" content="Interkombo Logistics: home removals, office relocations, goods transport, nationwide delivery and cross-border freight across South Africa and the SADC region. Get an instant quote and track your shipment online.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="Interkombo Logistics">
  <meta property="og:description" content="Removals, relocations & freight across South Africa and beyond. Instant quotes and live tracking.">
  <meta property="og:image" content="assets/img/logo-light.png">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/store.js"></script>
  <script src="assets/js/icons.js"></script>
</head>
<body>
  <a class="sr-only" href="#main">Skip to content</a>
  <div class="promo-bar" id="promoBar" hidden></div>

  <header class="site-header" id="header">
    <div class="container nav">
      <a href="#/" class="brand" aria-label="Interkombo Logistics home">
        <img class="logo-light" src="assets/img/logo-light.png" alt="Interkombo Logistics" width="92" height="44">
        <img class="logo-dark" src="assets/img/logo-dark.png" alt="Interkombo Logistics" width="92" height="44">
      </a>
      <ul class="nav-links" id="navLinks"></ul>
      <div class="nav-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
        <a href="#/quote" class="btn btn-primary btn-quote">Get a Quote</a>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
      </div>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Menu">
    <div class="drawer-top">
      <img class="logo-light" src="assets/img/logo-light.png" alt="Interkombo Logistics">
      <img class="logo-dark" src="assets/img/logo-dark.png" alt="Interkombo Logistics">
      <button class="icon-btn" id="closeDrawer" aria-label="Close menu"></button>
    </div>
    <nav id="drawerNav"></nav>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer" id="footer"></footer>

  <a class="wa-fab" id="waFab" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"></a>
  <button class="to-top" id="toTop" aria-label="Back to top"></button>
  <div class="mobile-sum-bar" id="sumBar" hidden></div>
  <div id="popupRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="assets/js/app.js"></script>
</body>
</html>
